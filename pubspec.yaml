name: fitforge
description: "Workout tracker with intelligent workout generation and progressive overload."
publish_to: 'none'
version: 0.1.1+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Database
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28

  # WebDAV
  webdav_client: ^1.2.2

  # Charts
  fl_chart: ^0.70.2

  # Utilities
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  intl: ^0.20.2
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  share_plus: ^10.1.4
  file_picker: ^9.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  drift_dev: ^2.22.1

  freezed: ^2.5.7
  json_serializable: ^6.9.4


flutter:
  uses-material-design: true